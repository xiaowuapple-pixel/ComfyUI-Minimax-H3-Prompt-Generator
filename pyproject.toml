[project]
name = "comfyui-prompt-enhancer-suite"
version = "1.0.4"
description = "Prompt enhancer nodes for ComfyUI: Qwen Image 2.1 prompt expansion (PE-T2I / PE-I2I), MiniMax H3 video prompts, and general image prompts."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["Pillow", "numpy"]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/xiaowuapple-pixel/ComfyUI-Prompt-Enhancer"

[project.optional-dependencies]
local-gguf = ["llama-cpp-python>=0.3.46"]
rtx = ["nvidia-vfx"]

[tool.comfy]
PublisherId = "xiaowu"
DisplayName = "Prompt Enhancer"
Icon = ""
includes = []
